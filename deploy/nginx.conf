limit_req_zone $binary_remote_addr zone=idee_read:10m rate=5r/s;
limit_req_zone $binary_remote_addr zone=idee_write:10m rate=2r/s;
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    absolute_redirect off;
    client_max_body_size 256k;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    location ^~ /api/admin/ {
        limit_req zone=idee_write burst=10 nodelay;
        proxy_pass http://api:8087;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 45s;
    }
    location ^~ /api/ {
        limit_req zone=idee_read burst=20 nodelay;
        proxy_pass http://api:8087;
        proxy_set_header Host $host;
        proxy_read_timeout 45s;
    }
    # Serve compiled assets directly; public pages are rendered by Angular on Node.
    location ^~ /assets/ {
        try_files $uri =404;
    }
    location ~ \.(?:js|css|map|ico|svg|png|jpg|jpeg|webp|woff|woff2|ttf)$ {
        try_files $uri =404;
    }
    location / {
        limit_req zone=idee_read burst=20 nodelay;
        proxy_pass http://ssr:4000;
        proxy_set_header Host $host;
        proxy_read_timeout 30s;
        proxy_redirect off;
    }
}
