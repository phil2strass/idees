<VirtualHost *:80>
    ServerName idees.cavousdit.com
    DocumentRoot /var/www/idee-acme
    <Directory /var/www/idee-acme>
        Options None
        AllowOverride None
        Require all granted
    </Directory>
    RewriteEngine On
    RewriteCond %{REQUEST_URI} !^/\.well-known/acme-challenge/
    RewriteRule ^ https://idees.cavousdit.com%{REQUEST_URI} [R=301,L,NE]
    ErrorLog ${APACHE_LOG_DIR}/idees-error.log
    CustomLog ${APACHE_LOG_DIR}/idees-access.log combined
</VirtualHost>

<VirtualHost *:443>
    ServerName idees.cavousdit.com
    SSLEngine On
    Include /etc/letsencrypt/options-ssl-apache.conf
    SSLCertificateFile /etc/letsencrypt/live/idees.cavousdit.com/fullchain.pem
    SSLCertificateKeyFile /etc/letsencrypt/live/idees.cavousdit.com/privkey.pem

    ProxyPreserveHost On
    RequestHeader set X-Forwarded-Proto "https"
    ProxyPass /api/ http://127.0.0.1:8087/api/ connectiontimeout=5 timeout=45
    ProxyPassReverse /api/ http://127.0.0.1:8087/api/
    ProxyPass / http://127.0.0.1:4000/ connectiontimeout=5 timeout=45
    ProxyPassReverse / http://127.0.0.1:4000/
    LimitRequestBody 262144
    ErrorLog ${APACHE_LOG_DIR}/idees-error.log
    CustomLog ${APACHE_LOG_DIR}/idees-access.log combined
</VirtualHost>
