<VirtualHost *:80>
    ServerName idees.cavousdit.com
    DocumentRoot /var/www/idee-acme
    ProxyPreserveHost On
    ProxyPass /.well-known/acme-challenge/ !
    <Directory /var/www/idee-acme>
        Options None
        AllowOverride None
        Require all granted
    </Directory>
    ProxyPass /api/ http://127.0.0.1:8087/api/ connectiontimeout=5 timeout=45
    ProxyPassReverse /api/ http://127.0.0.1:8087/api/
    ProxyPass / http://127.0.0.1:4000/ connectiontimeout=5 timeout=45
    ProxyPassReverse / http://127.0.0.1:4000/
    LimitRequestBody 262144
    ErrorLog ${APACHE_LOG_DIR}/idees-error.log
    CustomLog ${APACHE_LOG_DIR}/idees-access.log combined
</VirtualHost>
