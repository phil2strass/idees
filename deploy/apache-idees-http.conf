# Configuration temporaire pour la validation ACME avant installation du certificat.
<VirtualHost *:80>
    ServerName ideesdesorties.eu
    ServerAlias www.ideesdesorties.eu
    DocumentRoot /var/www/idee-acme
    <Directory /var/www/idee-acme>
        Options None
        AllowOverride None
        Require all granted
    </Directory>
    RewriteEngine On
    RewriteCond %{REQUEST_URI} !^/\.well-known/acme-challenge/
    RewriteRule ^ - [R=503,L]
    ErrorLog ${APACHE_LOG_DIR}/idees-error.log
    CustomLog ${APACHE_LOG_DIR}/idees-access.log combined
</VirtualHost>
