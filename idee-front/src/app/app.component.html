<a class="skip-link" [href]="router.url.split('#')[0] + '#content'">{{
  t("Aller au contenu")
}}</a>
<header class="site-header" (keydown.escape)="menuOpen.set(false)">
  <a
    class="brand"
    [routerLink]="i18n.path('/')"
    (click)="browse()"
    [attr.aria-label]="t('Idées de sorties en Alsace, accueil')"
    ><img src="assets/idee-icon.svg" alt="" width="42" height="52" /><span
      >idées<b>.</b><small>{{ t("de sorties en Alsace") }}</small></span
    ></a
  >
  <button
    class="menu-button"
    [attr.aria-label]="t('Ouvrir ou fermer la navigation')"
    aria-controls="main-nav"
    [attr.aria-expanded]="menuOpen()"
    (click)="menuOpen.set(!menuOpen())"
  >
    <i-tabler [name]="menuOpen() ? 'x' : 'menu-2'" />
  </button>
  <nav
    id="main-nav"
    class="nav"
    [class.open]="menuOpen()"
    [attr.aria-label]="t('Navigation principale')"
  >
    <a [routerLink]="i18n.path('/')" fragment="sorties" (click)="browse()">{{
      t("Les sorties")
    }}</a>
    <a
      [routerLink]="i18n.path('/')"
      fragment="sorties"
      (click)="browse('weekend')"
      >{{ t("Ce week-end") }}</a
    >
    <a
      [routerLink]="i18n.path('/')"
      fragment="sorties"
      (click)="browse('permanent')"
      >{{ t("Explorer l’Alsace") }}</a
    >
    <a
      class="cta"
      [routerLink]="i18n.path('/')"
      fragment="sorties"
      (click)="menuOpen.set(false)"
      >{{ t("Trouver une sortie") }} <span aria-hidden="true">↗</span></a
    >
  </nav>
  <div class="language-picker" role="group" [attr.aria-label]="t('Langue du site')">
    @for (language of i18n.languages; track language.code) {
      <button
        type="button"
        class="language-option"
        [class.active]="i18n.current() === language.code"
        [attr.aria-pressed]="i18n.current() === language.code"
        [attr.aria-label]="language.name"
        [attr.title]="language.name"
        [attr.lang]="language.code"
        [attr.data-language]="language.code"
        (click)="i18n.switchTo(language.code)"
      >
        <img [src]="'assets/flags/' + language.code + '.svg'" alt="" width="24" height="18" />
      </button>
    }
  </div>
</header>
<router-outlet />
